<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krey Confecciones</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f3ebdd">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Krey">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f5ee;--surf:#fff;--ink:#101a38;--mut:#636981;--line:#e6dcc8;--navy:#101a38;--gold:#d9ab3f;--goldt:#94691a;--tag:#efe6d6;--ok:#c9972f;--red:#b5402f;--track:#efe6d6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1424;--surf:#182039;--ink:#f3efe4;--mut:#a9aec6;--line:#2c3659;--navy:#0a0e1c;--gold:#e0b44a;--goldt:#e0b44a;--tag:#26304f;--ok:#e0b44a;--red:#ff9a86;--track:#26304f}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
h1,h2,dialog h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700}
header{max-width:480px;margin:0 auto;padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header small{display:block;color:var(--goldt);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
header h1{margin:2px 0 0;font-size:28px;line-height:1.1}
header img{width:46px;height:46px;border-radius:14px;box-shadow:0 2px 10px #0003}
main{max-width:480px;margin:0 auto;padding:16px 16px 170px}
.sech{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec{margin-bottom:14px}.sec h2{margin:0;font-size:30px;line-height:1.1}
.pill{background:var(--navy);color:var(--gold);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;white-space:nowrap}
.sub{color:var(--mut);font-size:14px;margin:4px 0 0}
.search{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:0 16px;background:var(--surf);border:2px solid var(--gold);border-radius:22px;color:var(--goldt)}
.search input{border:0;background:none;margin:0;padding:15px 0;font-size:16px;color:var(--ink);flex:1;min-width:0}
.search input:focus{outline:none}.search:focus-within{box-shadow:0 0 0 3px #d9ab3f66}
.card{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:0 6px 18px -14px #101a3877;color:inherit;font:inherit}
.card b{font-size:17px}
.oh,.clh{display:flex;align-items:center;gap:12px}.oh{justify-content:space-between}
.av{flex:none;width:52px;height:52px;border-radius:16px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:700 23px "Cormorant Garamond",Georgia,serif}
.cb{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--mut);font-size:13px}.meta span{display:inline-flex;gap:4px;align-items:center}
.tag{background:var(--tag);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pen{flex:none;width:38px;height:38px;border-radius:50%;background:var(--tag);display:grid;place-items:center;color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--navy);border-radius:16px;padding:12px 6px;margin-top:12px;text-align:center}
.strip.stats{grid-template-columns:repeat(3,1fr);margin:0 0 14px}
.strip small{display:block;color:#f3efe4;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.strip b{display:block;color:var(--gold);font-size:19px;font-weight:800;margin-top:2px}
.strip u{text-decoration:none;font-size:11px;font-weight:600;margin-left:2px}
.note{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:8px 10px;border:1px solid var(--line);background:var(--tag);border-radius:10px;font-size:13px}
.note svg{flex:none;color:var(--goldt);margin-top:2px}
.note span{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical}
.bar{height:10px;border-radius:6px;background:var(--track);margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.late{color:var(--red);font-weight:700}.soon{color:var(--goldt);font-weight:700}
.alert{background:var(--tag);border:1px solid var(--gold);border-radius:16px;padding:11px 14px;margin-bottom:14px;font-weight:700}
.seg{display:flex;gap:4px;background:var(--tag);padding:4px;border-radius:999px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border:0;background:none;border-radius:999px;font-weight:700;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--gold)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--surf);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mut);font-size:12px;font-weight:700;padding:6px 2px}
nav button[aria-current=true]{color:var(--ink)}nav button[aria-current=true] svg{color:var(--goldt)}
.fab{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));right:max(18px,calc(50% - 222px));width:62px;height:62px;border-radius:50%;border:2px solid var(--gold);background:var(--navy);color:var(--gold);display:grid;place-items:center;box-shadow:0 8px 22px -6px #101a38aa;z-index:6}
dialog{margin:auto auto 0;width:100%;max-width:480px;max-height:90vh;background:var(--bg);color:var(--ink);border:0;border-radius:28px 28px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));overflow:auto}
dialog::backdrop{background:#101a38aa}
dialog::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
dialog h2{margin:0 0 8px;font:700 29px "Cormorant Garamond",Georgia,serif}dialog h3{margin:18px 0 6px;font-size:23px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 0}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;background:var(--surf);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;font:inherit}
textarea{min-height:70px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0;background:var(--surf)}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.row>*{flex:1}
.pri,.ghost,.dng{padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);font:800 15px Manrope,system-ui,sans-serif;background:var(--surf);color:var(--ink)}
.pri{background:var(--navy);color:var(--gold);border-color:var(--navy)}.dng{color:var(--red)}
.cnt{display:flex;align-items:center;gap:10px;margin-top:10px}
.cnt button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold);background:var(--surf);color:var(--ink);font-size:20px;font-weight:800}
.cnt strong{min-width:80px;text-align:center}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--navy);color:var(--gold);padding:10px 16px;border-radius:999px;z-index:50;display:none}
button{cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:in .18s ease-out}@keyframes in{from{transform:translateY(12px);opacity:0}}}
dialog:has(.dh)::before{display:none}dialog:has(.dh){padding-top:0}
.dh{position:sticky;top:0;z-index:3;margin:0 -18px 14px;padding:18px 20px;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dh small{display:block;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
dialog .dh h2{margin:2px 0 0;color:#fff;font-size:28px}
.x{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#ffffff2e;color:#fff;font-size:24px;line-height:1}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700}
.chip span{width:28px;height:28px;border-radius:50%;background:var(--tag);display:grid;place-items:center;font-size:11px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chip.on span{background:var(--gold);color:var(--navy)}
.mbox{background:var(--tag);border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:12px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--goldt);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.mini{flex:none;border:0;background:var(--navy);color:var(--gold);border-radius:10px;padding:8px 12px;font-weight:800;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--tag);border-radius:16px;padding:4px 12px 12px;margin-top:10px}
.ith{display:flex;justify-content:space-between;align-items:center}
.lnk{border:0;background:none;color:var(--red);font-weight:700}
.mf{display:flex;flex-direction:column;gap:2px;margin:0;background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;color:var(--mut);font-size:12px;font-weight:700}
.mfi{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.mfi input{border:0;background:none;margin:0;padding:2px 0;font-size:21px;font-weight:800;min-width:0;width:100%;border-radius:0}
.mfi input:focus{outline:none}.mf:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px #d9ab3f55}
.mfi i{font-style:normal;font-size:12px;font-weight:600;color:var(--mut)}
.grid.c2{grid-template-columns:1fr 1fr}.c2 .mf:last-child{grid-column:1/-1}
.mtitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);margin:18px 0 10px;padding-top:14px;color:var(--goldt);font-size:13px;font-weight:800;text-transform:uppercase}
.mtitle small{font-weight:600;text-transform:none;color:var(--mut)}
</style></head>
<body>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const M=[['largo','Largo'],['cintura','Cintura'],['cadera','Cadera'],['rodilla','Rodilla'],['bota','Bota']];
let S={clients:[],orders:[],notified:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('sastreria')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sastreria',JSON.stringify(S))}catch(e){toast('No se pudo guardar en este navegador')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dlg=$('#dlg');
let tab='orders',showDelivered=false,D=null;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysTo=s=>Math.round((new Date(s+'T00:00')-new Date(today()+'T00:00'))/864e5);
const fmtDate=s=>new Date(s+'T00:00').toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'});
function dueText(o){const n=daysTo(o.due),f=fmtDate(o.due);
 if(o.delivered)return `<span class=sub>Entregado · ${f}</span>`;
 if(n<0)return `<span class=late>Vencido hace ${-n} ${-n==1?'día':'días'} (${f})</span>`;
 if(n==0)return `<span class=late>Se entrega hoy</span>`;
 if(n==1)return `<span class=soon>Se entrega mañana</span>`;
 if(n<=3)return `<span class=soon>En ${n} días (${f})</span>`;
 return `<span class=sub>Entrega ${f}</span>`}
const tot=o=>o.items.reduce((a,i)=>({t:a.t+i.qty,d:a.d+i.done}),{t:0,d:0});

function render(){
 const up=S.orders.filter(o=>!o.delivered&&daysTo(o.due)<=2).length;
 $('#app').innerHTML=`<header><div><small>Sastrería</small><h1>Krey Confecciones</h1></div><img src="icons/icon-192.png" alt="Logo de Krey Confecciones"></header><main>${tab=='orders'?ordersView(up):tab=='clients'?clientsView():settingsView()}</main>
 ${tab!='settings'?`<button class=fab data-act="${tab=='orders'?'newOrder':'newClient'}" aria-label="${tab=='orders'?'Nuevo pedido':'Nuevo cliente'}">${svg('plus',26)}</button>`:''}
 <nav>${[['clients','Clientes & Medidas','book'],['orders','Pedidos & Lotes','cut'],['settings','Ajustes','gear']].map(t=>`<button data-tab=${t[0]} ${tab==t[0]?'aria-current=true':''}>${svg(t[2],24)}<span>${t[1]}</span></button>`).join('')}</nav>`}

function ordersView(up){
 const list=S.orders.filter(o=>!!o.delivered==showDelivered).sort((a,b)=>a.due.localeCompare(b.due));
 const pend=S.orders.filter(o=>!o.delivered),falt=pend.reduce((a,o)=>{const t=tot(o);return a+t.t-t.d},0);
 return `${sec('Pedidos & Lotes',pend.length+(pend.length==1?' pendiente':' pendientes'),'Entregas, avance de cada lote y recordatorios')}
 ${showDelivered?'':`<div class="strip stats"><div><small>Pedidos</small><b>${pend.length}</b></div><div><small>Prendas por hacer</small><b>${falt}</b></div><div><small>Vencen pronto</small><b>${up}</b></div></div>`}
 ${up&&!showDelivered?`<div class=alert>${up} ${up==1?'pedido vence':'pedidos vencen'} en los próximos 2 días</div>`:''}
 <div class=seg><button data-act=pend aria-pressed=${!showDelivered}>Pendientes</button><button data-act=deliv aria-pressed=${showDelivered}>Entregados</button></div>
 ${list.length?list.map(o=>{const t=tot(o),p=t.t?Math.round(t.d/t.t*100):0;
  return `<button class=card data-act=openOrder data-id=${o.id}><div class=oh><b>${esc(o.client)}</b><span class=tag>${t.d}/${t.t}</span></div><div>${dueText(o)}</div>
  <div class=bar><i style="width:${p}%"></i></div><div class=sub>${t.d} de ${t.t} listas · faltan ${t.t-t.d}</div></button>`}).join('')
 :`<div class=empty>${showDelivered?'Aún no hay pedidos entregados.':'No hay pedidos pendientes. Toca + para registrar el primero.'}</div>`}`}

let q='';
const P={book:'<path d="M4 4h12a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z"/><path d="M18 8h2M18 12h2M18 16h2"/><circle cx="11" cy="10" r="2"/><path d="M7.5 16c.5-2 2-3 3.5-3s3 1 3.5 3"/>',cut:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',note:'<path d="M4 4h16v12H8l-4 4z"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const svg=(n,s=20)=>`<svg width=${s} height=${s} viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round aria-hidden=true>${P[n]}</svg>`;
const sec=(t,pill,sub)=>`<div class=sec><div class=sech><h2>${t}</h2>${pill?`<span class=pill>${pill}</span>`:''}</div>${sub?`<p class=sub>${sub}</p>`:''}</div>`;
const strip=(m,always)=>(!always&&!M.some(k=>m&&m[k[0]]))?'':`<div class=strip>${M.map(k=>`<div><small>${k[1]}</small><b>${m&&m[k[0]]?esc(m[k[0]]):'–'}<u>cm</u></b></div>`).join('')}</div>`;
const chips=m=>strip(m);
function clientList(){const l=S.clients.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
 return l.length?l.map(c=>{const n=S.orders.filter(o=>!o.delivered&&o.client.trim().toLowerCase()==c.name.trim().toLowerCase()).length,ini=c.name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  return `<div class="card" role=button tabindex=0 data-act=editClient data-id=${c.id}><div class=clh><span class=av>${esc(ini)}</span><div class=cb><b>${esc(c.name)}</b><div class=meta>${c.phone?`<span>${svg('phone',13)}${esc(c.phone)}</span>`:''}${c.upd?`<span>Act. ${new Date(c.upd).toLocaleDateString('es-CO',{day:'numeric',month:'short'})}</span>`:''}</div></div>${n?`<span class=tag>${n} ${n==1?'pedido':'pedidos'}</span>`:''}<span class=pen>${svg('pen',16)}</span></div>${strip(c.m,1)}${c.notes?`<div class=note>${svg('note',14)}<span>${esc(c.notes)}</span></div>`:''}</div>`}).join(''):`<div class=empty>${S.clients.length?'Ningún cliente coincide.':'Aún no hay clientes. Toca + para guardar las medidas del primero.'}</div>`}
const clientsView=()=>`${sec('Libreta de Medidas',S.clients.length+(S.clients.length==1?' cliente':' clientes'),'Busca un cliente y consulta sus medidas al instante')}<label class=search>${svg('search',20)}<input id=q type=search placeholder="Escribe un nombre para buscar" value="${esc(q)}" aria-label="Buscar cliente"></label><div id=list>${clientList()}</div>`;

let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(tab=='settings'&&!dlg.open)render()});
function instCard(){const on=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 return `<div class=card><b>Instalar la app</b><p class=sub>${on?'Ya está instalada en este teléfono.':dip?'Instálala para abrirla desde la pantalla de inicio, incluso sin internet.':'Android: abre este enlace en Chrome (no desde WhatsApp) y usa el menú ⋮ → Instalar app. iPhone: en Safari, Compartir → Añadir a pantalla de inicio.'}</p>${!on&&dip?'<button class=pri data-act=install>Instalar app</button>':''}</div>`}
function settingsView(){const np='Notification' in window?Notification.permission:'no';
 return `${sec('Ajustes','','Instalación, recordatorios y copia de seguridad')}${instCard()}
 <div class=card><b>Recordatorios</b><p class=sub>${np=='granted'?'Activados. Recibirás un aviso cuando un pedido venza hoy, mañana o ya esté vencido (con la app abierta).':np=='denied'?'Están bloqueados. Actívalos en los permisos del navegador.':np=='no'?'Este navegador no soporta notificaciones.':'Aún no están activados.'}</p>
 ${np=='default'?'<button class=pri data-act=notif>Activar recordatorios</button>':''}</div>
 <div class=card><b>Copia de seguridad</b><p class=sub>Tus datos se guardan en este dispositivo. Copia este texto y guárdalo en un lugar seguro (por ejemplo, enviándotelo por WhatsApp).</p>
 <textarea id=bk readonly>${esc(JSON.stringify({clients:S.clients,orders:S.orders}))}</textarea>
 <div class=row><button class=ghost data-act=copy>Copiar copia</button></div>
 <label>Restaurar desde una copia (reemplaza lo actual)<textarea id=rs placeholder="Pega aquí la copia"></textarea></label>
 <div class=row><button class=dng data-act=restore>Restaurar</button></div></div>`}

function openDlg(h){dlg.innerHTML=h;if(!dlg.open)dlg.showModal()}
const mInputs=(m,attr,cols)=>`<div class="grid${cols==2?' c2':''}">${M.map(k=>`<label class=mf>${k[1]} (cm)<span class=mfi><input type=number step=0.1 inputmode=decimal placeholder="0.0" ${attr} data-m=${k[0]} value="${esc(m&&m[k[0]])}"><i>cm</i></span></label>`).join('')}</div>`;

/* Clientes */
function clientForm(id){const c=S.clients.find(x=>x.id==id);D=c?JSON.parse(JSON.stringify(c)):{id:uid(),name:'',phone:'',notes:'',m:{},isNew:1};
 openDlg(`${dh('Registro sartorial',c?'Editar Cliente & Medidas':'Nuevo Cliente & Medidas')}
 <label>Nombre completo *<input data-k=name placeholder="Ej: Ignacio Mendoza" value="${esc(D.name)}"></label>
 <label>Teléfono / WhatsApp *<input data-k=phone type=tel inputmode=tel placeholder="Ej: +57 312 456 7890" value="${esc(D.phone)}"></label>
 <label>Notas de postura / preferencias<input data-k=notes placeholder="Ej: Corte slim fit, tiro medio..." value="${esc(D.notes)}"></label>
 <div class=mtitle><span>Medidas del cliente (cm)</span><small>Ej. 102.5 cm</small></div>${mInputs(D.m,'data-cm=1',2)}
 <div class=row><button class=pri style="padding:16px" data-act=saveClient>Guardar cliente</button></div>
 ${c?'<div class=row><button class=dng data-act=delClient data-sure=1>Eliminar cliente</button></div>':''}`)}

/* Pedidos */
const newItem=()=>({id:uid(),garment:'',person:'',qty:1,done:0,m:{}});
function ordForm(id){const o=S.orders.find(x=>x.id==id);D=o?JSON.parse(JSON.stringify(o)):{id:uid(),client:'',due:'',notes:'',delivered:false,items:[newItem()],isNew:1};drawOrd()}
const dh=(eb,t)=>`<div class=dh><div><small>${eb}</small><h2>${t}</h2></div><button class=x data-act=close aria-label="Cerrar">×</button></div>`;
function pickClient(id){const c=S.clients.find(x=>x.id==id);if(!c)return;D.clientId=c.id;D.client=c.name;const it=D.items[0];it.m={...c.m};it.cid=c.id;it.person='';drawOrd()}
function itemForm(it,i){const c=S.clients.find(x=>x.id==it.cid);
 return `<div class=item><div class=ith><b>Prenda ${i+1}</b>${D.items.length>1?`<button class=lnk data-act=rmItem data-i=${i}>Quitar</button>`:''}</div>
 <label>Tipo de prenda *<input data-i=${i} data-f=garment placeholder="Ej: Camisas institucionales, Pantalón de vestir" value="${esc(it.garment)}"></label>
 <div class=two><label>Cantidad a hacer *<input type=number min=1 inputmode=numeric data-i=${i} data-f=qty value=${it.qty}></label><label>Ya hechas (avance)<input type=number min=0 inputmode=numeric data-i=${i} data-f=done value=${it.done}></label></div>
 <label>Tela & material<input data-i=${i} data-f=fabric placeholder="Ej: Popelina blanca, lana fría azul marino" value="${esc(it.fabric)}"></label>
 <label>Para (persona, opcional)<input data-i=${i} data-f=person placeholder="Ej: quien usará la prenda" value="${esc(it.person)}"></label>
 <div class=mbox><div class=mh><span>Medidas${c?' de '+esc(c.name):''} (cm)</span>${c?`<button class=mini data-act=updFicha data-i=${i}>Actualizar ficha</button>`:''}</div>
 <p class=sub>Puedes ajustar cualquier medida en cm ahora mismo</p>${c&&c.notes?`<div class=note><span><b>Nota:</b> ${esc(c.notes)}</span></div>`:''}
 ${S.clients.length?`<label>Cargar medidas de un cliente guardado<select data-i=${i} data-pick=1><option value="">Elegir…</option>${S.clients.map(x=>`<option value=${x.id}>${esc(x.name)}</option>`).join('')}</select></label>`:''}
 ${mInputs(it.m,'data-i='+i)}</div></div>`}
function drawOrd(){
 const chips2=S.clients.length?`<div class=chiprow>${S.clients.map(c=>{const p=c.name.trim().split(/\s+/);return `<button class="chip${D.clientId==c.id?' on':''}" data-act=pickClient data-id=${c.id}><span>${esc(p.slice(0,2).map(w=>w[0]).join('').toUpperCase())}</span>${esc(p[0])}</button>`}).join('')}</div>`:'';
 const sel=S.clients.length?`<label>O elige de la lista<select data-pickc=1><option value="">Elegir cliente…</option>${S.clients.map(c=>`<option value=${c.id} ${D.clientId==c.id?'selected':''}>${esc(c.name)}${c.phone?' — '+esc(c.phone):''}</option>`).join('')}</select></label>`:'';
 openDlg(`${dh('Agenda & producción',D.isNew?'Nuevo pedido o lote':'Editar pedido o lote')}
 <h3>1. Cliente o empresa *</h3>${chips2}${sel}
 <label>Nombre que aparece en el pedido<input data-k=client placeholder="Ej: Ignacio Mendoza o Dotaciones SAS" value="${esc(D.client)}"></label>
 <h3>2. Prendas (${D.items.length})</h3>${D.items.map(itemForm).join('')}
 <button class=ghost style="width:100%" data-act=addItem>+ Agregar otra prenda o persona</button>
 <h3>3. Entrega</h3><label>Fecha de entrega *<input type=date data-k=due value="${D.due}"></label>
 <label>Notas<textarea data-k=notes>${esc(D.notes)}</textarea></label>
 <div class=row><button class=ghost data-act=close>Cancelar</button><button class=pri data-act=saveOrder>Guardar pedido</button></div>`)}

function showOrder(id){const o=S.orders.find(x=>x.id==id);if(!o)return;const t=tot(o);
 openDlg(`${dh('Pedido o lote',esc(o.client))}<div>${dueText(o)}</div><div class=bar><i style="width:${t.t?t.d/t.t*100:0}%"></i></div>
 <div class=sub>${t.d} de ${t.t} listas · faltan ${t.t-t.d}</div>${o.notes?`<p>${esc(o.notes)}</p>`:''}
 ${o.items.map((it,i)=>`<div class=item><b>${esc(it.garment)}</b>${it.person?` — ${esc(it.person)}`:''}${it.fabric?`<div class=sub>${esc(it.fabric)}</div>`:''}${chips(it.m)}
 <div class=cnt><button data-act=dec data-id=${o.id} data-i=${i} aria-label="Una menos">−</button><strong>${it.done} de ${it.qty}</strong><button data-act=inc data-id=${o.id} data-i=${i} aria-label="Una más">+</button></div></div>`).join('')}
 <div class=row><button class=ghost data-act=close>Cerrar</button><button class=ghost data-act=editOrder data-id=${o.id}>Editar</button>
 <button class=pri data-act=deliver data-id=${o.id}>${o.delivered?'Reabrir':'Marcar entregado'}</button></div>
 <div class=row><button class=dng data-act=delOrder data-id=${o.id} data-sure=1>Eliminar pedido</button></div>`)}

/* Eventos */
document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();return}
 const b=e.target.closest('[data-act]');if(!b)return;
 if(b.dataset.sure&&!b.dataset.ok){b.dataset.ok=1;b.textContent='¿Seguro? Toca otra vez';return}
 const a=b.dataset.act,id=b.dataset.id,i=+b.dataset.i;
 const O=()=>S.orders.find(x=>x.id==id);
 if(a=='close')dlg.close();
 else if(a=='pend'){showDelivered=false;render()}else if(a=='deliv'){showDelivered=true;render()}
 else if(a=='newOrder')ordForm();else if(a=='openOrder')showOrder(id);else if(a=='editOrder')ordForm(id);
 else if(a=='newClient')clientForm();else if(a=='editClient')clientForm(id);
 else if(a=='pickClient')pickClient(id);
 else if(a=='updFicha'){const it=D.items[i],c=S.clients.find(x=>x.id==it.cid);if(c){c.m={...it.m};c.upd=Date.now();save();toast('Ficha de '+c.name+' actualizada')}}
 else if(a=='addItem'){D.items.push(newItem());drawOrd()}
 else if(a=='rmItem'){D.items.splice(i,1);drawOrd()}
 else if(a=='inc'||a=='dec'){const it=O().items[i];it.done=Math.max(0,Math.min(it.qty,it.done+(a=='inc'?1:-1)));save();showOrder(id)}
 else if(a=='deliver'){const o=O();o.delivered=!o.delivered;save();dlg.close()}
 else if(a=='delOrder'){S.orders=S.orders.filter(x=>x.id!=id);save();dlg.close();toast('Pedido eliminado')}
 else if(a=='delClient'){S.clients=S.clients.filter(x=>x.id!=D.id);save();dlg.close();toast('Cliente eliminado')}
 else if(a=='saveClient'){if(!D.name.trim())return toast('Escribe el nombre del cliente');if(!D.phone.trim())return toast('Escribe el teléfono o WhatsApp');delete D.isNew;D.upd=Date.now();const k=S.clients.findIndex(x=>x.id==D.id);k<0?S.clients.push(D):S.clients[k]=D;save();dlg.close();toast('Cliente guardado')}
 else if(a=='saveOrder'){if(!D.client.trim())return toast('Escribe el cliente o la empresa');if(!D.due)return toast('Elige la fecha de entrega');
  if(D.items.some(x=>!x.garment.trim()))return toast('Escribe el nombre de cada prenda');
  D.items.forEach(x=>{x.qty=Math.max(1,+x.qty||1);x.done=Math.max(0,Math.min(+x.done||0,x.qty))});delete D.isNew;
  const k=S.orders.findIndex(x=>x.id==D.id);k<0?S.orders.push(D):S.orders[k]=D;save();dlg.close();toast('Pedido guardado');check()}
 else if(a=='install'){if(dip){dip.prompt();dip=null}}
 else if(a=='notif'){Notification.requestPermission().then(()=>{render();check()})}
 else if(a=='copy'){const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copia lista para pegar'),()=>document.execCommand('copy'))}catch(x){document.execCommand('copy');toast('Copiado')}}
 else if(a=='restore'){try{const r=JSON.parse($('#rs').value);if(!Array.isArray(r.clients)||!Array.isArray(r.orders))throw 0;S.clients=r.clients;S.orders=r.orders;save();render();toast('Datos restaurados')}catch(x){toast('El texto no es una copia válida')}}
});
dlg.addEventListener('input',e=>{const t=e.target;if(!D)return;
 if(t.dataset.k){D[t.dataset.k]=t.value;if(t.dataset.k=='client')D.clientId=''}
 else if(t.dataset.cm)D.m[t.dataset.m]=t.value;
 else if(t.dataset.i!=null&&t.dataset.f)D.items[+t.dataset.i][t.dataset.f]=t.type=='number'?+t.value:t.value;
 else if(t.dataset.i!=null&&t.dataset.m)D.items[+t.dataset.i].m[t.dataset.m]=t.value});
dlg.addEventListener('change',e=>{const t=e.target;if(t.dataset.pickc&&t.value){pickClient(t.value);return}if(t.dataset.pick&&t.value){const c=S.clients.find(x=>x.id==t.value),it=D.items[+t.dataset.i];it.m={...c.m};it.cid=c.id;if(!it.person)it.person=c.name;drawOrd()}});
dlg.addEventListener('close',()=>{D=null;render()});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#list').innerHTML=clientList()}});

/* Recordatorios (con la app abierta) */
const show=(t,o)=>('serviceWorker' in navigator&&navigator.serviceWorker.ready)?navigator.serviceWorker.ready.then(r=>r.showNotification(t,{...o,icon:'icons/icon-192.png'})):new Notification(t,o);
function check(){try{if(!('Notification' in window)||Notification.permission!='granted')return;
 S.orders.filter(o=>!o.delivered&&daysTo(o.due)<=1&&S.notified[o.id]!=today()).forEach(o=>{const n=daysTo(o.due),t=tot(o);
  show('Entrega '+(n<0?'vencida':n==0?'hoy':'mañana')+': '+o.client,{body:'Faltan '+(t.t-t.d)+' de '+t.t+' prendas'});S.notified[o.id]=today()});save()}catch(e){}}
render();check();setInterval(check,600000);
{const a=new URLSearchParams(location.search).get('action');if(a=='newOrder'){tab='orders';render();ordForm()}else if(a=='newClient'){tab='clients';render();clientForm()}}
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.getAttribute&&e.target.getAttribute('role')=='button'){e.preventDefault();e.target.click()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
